[project]
name = "video-transcription-pipeline"
version = "0.2.0"
description = "Universal video-to-audio-to-text transcription pipeline using FFmpeg, Qwen3-ASR 1.7B, and PyAnnote Speaker Diarization"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "qwen-asr>=0.0.6",
    "accelerate>=1.0.0",
    "soundfile>=0.14.0",
    "librosa>=0.10.0",
    "pyannote-audio>=3.1.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
    "ffmpeg-python>=0.2.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_transcription"]

[project.scripts]
transcribe = "video_transcription.pipeline:main"
download-weights = "video_transcription.weights:main"
