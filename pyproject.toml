[project]
name = "video-transcription-pipeline"
version = "0.1.0"
description = "Universal video-to-audio-to-text transcription pipeline using FFmpeg, WhisperX large-v3, and PyAnnote Speaker Diarization"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "whisperx==3.8.6",
    "pyannote-audio>=3.1.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
    "ffmpeg-python>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_transcription"]

[project.scripts]
transcribe = "video_transcription.pipeline:main"
download-weights = "video_transcription.weights:main"
